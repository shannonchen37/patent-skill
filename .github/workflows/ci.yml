name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .

  packaged-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m venv /tmp/patent-skill-wheel-test
      - run: /tmp/patent-skill-wheel-test/bin/pip install dist/*.whl
      - run: /tmp/patent-skill-wheel-test/bin/patent-skill --help
      - run: mkdir -p /tmp/patent-project && printf 'value = 1\n' > /tmp/patent-project/core.py
      - run: /tmp/patent-skill-wheel-test/bin/patent-skill case init /tmp/patent-case --project /tmp/patent-project
      - run: /tmp/patent-skill-wheel-test/bin/patent-skill case validate /tmp/patent-case
