[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patent-skill"
version = "0.0.0"
description = "Orchestrate evidence-traceable Chinese invention patent cases from R&D projects."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "shannonchen37"}]
dependencies = ["jsonschema>=4.23"]

[project.urls]
Homepage = "https://github.com/shannonchen37/patent-skill"
Repository = "https://github.com/shannonchen37/patent-skill.git"
Issues = "https://github.com/shannonchen37/patent-skill/issues"

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
patent-skill = "patent_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["patent_skill"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/engineering-provenance.schema.json" = "patent_skill/schemas/engineering-provenance.schema.json"
"schemas/invention.schema.json" = "patent_skill/schemas/invention.schema.json"
"schemas/case-feature-matrix.schema.json" = "patent_skill/schemas/case-feature-matrix.schema.json"
"schemas/context-questions.schema.json" = "patent_skill/schemas/context-questions.schema.json"
"schemas/application-metadata.schema.json" = "patent_skill/schemas/application-metadata.schema.json"
"schemas/final-audit.schema.json" = "patent_skill/schemas/final-audit.schema.json"
"schemas/figure-manifest.schema.json" = "patent_skill/schemas/figure-manifest.schema.json"
"schemas/claims-v2-structure.schema.json" = "patent_skill/schemas/claims-v2-structure.schema.json"
"schemas/claim-support-map.schema.json" = "patent_skill/schemas/claim-support-map.schema.json"
"schemas/case-search-record.schema.json" = "patent_skill/schemas/case-search-record.schema.json"
"schemas/final-search-session.schema.json" = "patent_skill/schemas/final-search-session.schema.json"
"schemas/case-status.schema.json" = "patent_skill/schemas/case-status.schema.json"
"schemas/independent-audit.schema.json" = "patent_skill/schemas/independent-audit.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
